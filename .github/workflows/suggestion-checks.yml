name: Suggestion feature checks

on:
  pull_request:
    paths:
      - 'scripts/main_menu.gd'
      - 'scripts/suggestion_*.gd'
      - 'scripts/online_config.gd'
      - 'leaderboard-api/**'
      - '.github/workflows/suggestion-checks.yml'
  workflow_dispatch:

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Worker suggestion API
        working-directory: leaderboard-api
        run: node --test test/*.test.mjs

  godot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import project and detect GDScript parser errors
        run: |
          godot --headless --import --path . 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR:|Failed to load script' godot-import.log; then
            echo "GDScript parser errors found"
            exit 1
          fi
