<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Wave Defence — offline</title>
		<style>
html {
	background-color: #000000;
	color: #ffffff;
}

body {
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
	margin: 2rem;
	max-width: 28rem;
}

p {
	margin-block: 1rem;
	line-height: 1.45;
}

button {
	display: block;
	padding: 1rem 2rem;
	margin: 2rem auto 0;
}
		</style>
	</head>
	<body>
		<h1>Can't load the game yet</h1>
		<p>
			Open Wave Defence once while online (or use <strong>Settings → Update app</strong>)
			so this phone can finish downloading. After that you can play offline.
		</p>
		<p>Press Reload when you have a connection:</p>
		<button type="button">Reload</button>
		<script>
document.querySelector('button').addEventListener('click', () => {
	window.location.reload();
});
		</script>
	</body>
</html>
